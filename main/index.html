<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ESP32-CAM</title>
<style>
  :root { --bg: #111; --panel: #1c1c1c; --fg: #eee; --muted: #999; --accent: #ff9f1c; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.4 system-ui, sans-serif; }
  main { max-width: 860px; margin: 0 auto; padding: 16px; }
  header { display: flex; justify-content: space-between; align-items: center; margin: 0 0 12px; }
  h1 { font-size: 18px; margin: 0; }
  header button { padding: 6px 12px; }
  .view { position: relative; background: #000; border-radius: 8px; overflow: hidden; aspect-ratio: 4 / 3; }
  .view img { width: 100%; height: 100%; object-fit: contain; display: block; }
  .view .off { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); }
  .controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin: 12px 0; }
  button { background: var(--panel); color: var(--fg); border: 1px solid #333; border-radius: 6px;
           padding: 9px 14px; font: inherit; cursor: pointer; }
  button.primary { background: var(--accent); color: #111; border-color: var(--accent); font-weight: 600; }
  button:disabled { opacity: .5; cursor: wait; }
  .switch { display: flex; align-items: center; gap: 8px; color: var(--fg); cursor: pointer; user-select: none; }
  .switch input { position: absolute; opacity: 0; width: 0; height: 0; }
  .switch .track { width: 42px; height: 24px; border-radius: 12px; background: #333; position: relative; transition: background .15s; }
  .switch .track::after { content: ''; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px;
                          border-radius: 50%; background: #ccc; transition: transform .15s; }
  .switch input:checked + .track { background: var(--accent); }
  .switch input:checked + .track::after { transform: translateX(18px); background: #111; }
  .switch input:focus-visible + .track { outline: 2px solid var(--accent); outline-offset: 2px; }
  #status { color: var(--muted); min-height: 1.4em; }
  h2 { font-size: 15px; margin: 20px 0 8px; }
  ul { list-style: none; padding: 0; margin: 0; }
  li { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid #222; }
  a { color: var(--accent); text-decoration: none; }
  .size { color: var(--muted); }
</style>
</head>
<body>
<main>
  <header>
    <h1>ESP32-CAM</h1>
    <form method="post" action="/logout"><button type="submit">Log out</button></form>
  </header>

  <div class="view">
    <img id="stream" alt="">
    <div class="off" id="off">Stream stopped</div>
  </div>

  <div class="controls">
    <button id="toggle">Start stream</button>
    <button id="capture" class="primary">Take photo</button>
    <label class="switch"><input type="checkbox" id="flash" role="switch"><span class="track"></span> Flash</label>
  </div>
  <div id="status"></div>

  <h2>Photos on SD card</h2>
  <ul id="photos"><li class="size">Loading...</li></ul>
</main>

<script>
const $ = id => document.getElementById(id);
const streamUrl = `http://${location.hostname}:81/stream`;
let streaming = false;

function setStream(on) {
  streaming = on;
  // Clearing src closes the connection, freeing the stream server for others
  $('stream').src = on ? streamUrl : '';
  $('off').style.display = on ? 'none' : 'grid';
  $('toggle').textContent = on ? 'Stop stream' : 'Start stream';
}

function esc(s) {
  return String(s).replace(/[&<>"']/g, c => `&#${c.charCodeAt(0)};`);
}

// Session expired or logged out elsewhere -> back to the login page
async function api(url, opts) {
  const res = await fetch(url, opts);
  if (res.status === 401) {
    location.href = '/';
    throw new Error('login required');
  }
  return res.json();
}

function fmtSize(bytes) {
  return bytes > 1e6 ? (bytes / 1e6).toFixed(1) + ' MB' : Math.round(bytes / 1e3) + ' KB';
}

async function loadPhotos() {
  const { sd, photos: list } = await api('/photos');
  if (!sd) {
    $('photos').innerHTML = '<li class="size">No SD card detected</li>';
    return;
  }
  list.sort((a, b) => b.name.localeCompare(a.name));
  $('photos').innerHTML = list.length
    ? list.map(p => `<li><a href="/photos/${encodeURIComponent(p.name)}" target="_blank">${esc(p.name)}</a>
                     <span class="size">${fmtSize(p.size)}</span></li>`).join('')
    : '<li class="size">No photos yet</li>';
}

$('toggle').onclick = () => setStream(!streaming);

$('capture').onclick = async () => {
  const btn = $('capture');
  btn.disabled = true;
  $('status').textContent = 'Capturing...';
  try {
    const res = await api('/capture?flash=' + ($('flash').checked ? 1 : 0), { method: 'POST' });
    $('status').innerHTML = res.ok
      ? `Saved <a href="/photos/${encodeURIComponent(res.file)}" target="_blank">${esc(res.file)}</a>`
      : 'Error: ' + esc(res.error);
    loadPhotos();
  } catch (e) {
    $('status').textContent = 'Error: ' + e;
  }
  btn.disabled = false;
};

// Flash switch: LED stays on while enabled, so photos are lit too
$('flash').onchange = async e => {
  try {
    const res = await api('/torch?on=' + (e.target.checked ? 1 : 0), { method: 'POST' });
    e.target.checked = res.on;
  } catch (err) {
    e.target.checked = !e.target.checked;
  }
};
api('/torch').then(res => { $('flash').checked = res.on; }).catch(() => {});

setStream(true);
loadPhotos();
</script>
</body>
</html>
