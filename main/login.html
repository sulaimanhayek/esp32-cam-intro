<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ESP32-CAM login</title>
<style>
  :root { --bg: #111; --panel: #1c1c1c; --fg: #eee; --muted: #999; --accent: #ff9f1c; --err: #ff6b6b; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px;
         background: var(--bg); color: var(--fg); font: 15px/1.4 system-ui, sans-serif; }
  form { width: 100%; max-width: 320px; background: var(--panel); border: 1px solid #2a2a2a;
         border-radius: 10px; padding: 24px; }
  h1 { font-size: 18px; margin: 0 0 16px; }
  label { display: block; color: var(--muted); margin-bottom: 6px; }
  input { width: 100%; padding: 10px 12px; border-radius: 6px; border: 1px solid #333;
          background: #111; color: var(--fg); font: inherit; }
  button { width: 100%; margin-top: 14px; padding: 10px; border: 0; border-radius: 6px;
           background: var(--accent); color: #111; font: inherit; font-weight: 600; cursor: pointer; }
  #msg { color: var(--err); min-height: 1.4em; margin: 10px 0 0; }
  .hint { color: var(--muted); font-size: 13px; margin: 14px 0 0; }
</style>
</head>
<body>
<form method="post" action="/login">
  <h1>ESP32-CAM</h1>
  <label for="password">Password</label>
  <input id="password" name="password" type="password" autocomplete="current-password" required autofocus>
  <button type="submit">Log in</button>
  <p id="msg"></p>
  <p class="hint">The password is printed on the serial log at boot.</p>
</form>
<script>
const p = new URLSearchParams(location.search);
const msg = { bad: 'Wrong password.', locked: 'Too many attempts. Try again in ' + p.get('wait') + ' s.' }[p.get('e')];
if (msg) document.getElementById('msg').textContent = msg;
</script>
</body>
</html>
